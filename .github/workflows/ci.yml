name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm_test" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://crm:crm@localhost:5432/crm_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests alembic && uv run mypy alembic_platform
      - run: uv run pytest --cov=app --cov-report=term-missing
      - name: Dependency audit
        run: |
          uv export --no-dev --no-hashes --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt"

  frontend:
    name: Frontend (lint, types, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=moderate

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t migratecrm-api:ci backend
      - run: docker build -t migratecrm-web:ci frontend
      - name: Smoke test web image (nginx config + SPA fallback)
        run: |
          docker run -d --name web -p 8080:8080 -e API_UPSTREAM=http://127.0.0.1:9 migratecrm-web:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz && break; sleep 1; done
          curl -sf http://localhost:8080/some/deep/link | grep -q '<div id="root">'
          curl -sI http://localhost:8080/ | grep -qi 'content-security-policy'
          docker rm -f web

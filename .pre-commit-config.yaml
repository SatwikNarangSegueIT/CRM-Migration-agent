# Install: pipx install pre-commit && pre-commit install
# Uses the project's own tool versions (uv / npm) so hooks match CI exactly.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: bash -c 'cd backend && uv run ruff check --fix .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format (backend)
        entry: bash -c 'cd backend && uv run ruff format .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend && uv run mypy app tests alembic'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npm run -s lint'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
      - id: prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx prettier --write .'
        language: system
        files: ^frontend/
        pass_filenames: false
